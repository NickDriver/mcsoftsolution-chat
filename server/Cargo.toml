[package]
name = "mcsoftsolution-chat"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Drop-in 'Chat with us' widget for Axum demos. Streams OpenRouter through a public MCP server."
repository = "https://github.com/mcsoftsolution/mcsoftsolution-chat"
readme = "../README.md"

[lib]
name = "mcsoftsolution_chat"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
futures-util = "0.3"
bytes = "1"
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "standalone"
path = "examples/standalone.rs"
